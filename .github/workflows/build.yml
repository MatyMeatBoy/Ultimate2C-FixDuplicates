name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test device selection
        shell: powershell
        run: .\tests\Selection.Tests.ps1
      - name: Build portable package
        shell: powershell
        run: .\build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: Ultimate2C-FixDuplicates
          path: dist/
